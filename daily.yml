name: Daily Copernicus pull
on:
  schedule:
    - cron: '30 10 * * *'   # 10:30 UTC = 4:30 am Costa Rica, before the morning brief
  workflow_dispatch: {}      # manual "Run workflow" button for testing
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install copernicusmarine numpy xarray
      - name: Fetch Copernicus subset
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: python fetch_copernicus.py
      - name: Commit result
        run: |
          git config user.name "fishfinder-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
